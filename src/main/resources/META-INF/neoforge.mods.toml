modLoader="javafml"
loaderVersion="[4,)"
license="${license}"
issueTrackerURL="${issues}"

[[mods]]
modId="${modId}"
version="${version}"
displayName="${modName}"
displayURL="${homepage}"
logoFile="assets/tinkerers_smithing/icon.png"
authors="${authors}"
credits="${credits}"
description='''${modDescription}'''

[[mixins]]
config="tinkerers_smithing.mixins.json"

[[dependencies.${modId}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoForgeVersion},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modId}]]
    modId="minecraft"
    type="required"
    versionRange="[${mc}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modId}]]
    modId="tinkerers_smithing"
    type="incompatible"
    reason="This mod is a standalone NeoForge fork of Tinkerer's Smithing and is incompatible with the original."

[[dependencies.${modId}]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="CLIENT"
