plugins {
    id "java-library"
    id "maven-publish"
    alias libs.plugins.modDev
}

version = project.modVersion
group = project.group
base.archivesName = project.slug

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoForgeVersion

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }
    }

    mods {
        "${project.modId}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org"
    }
    maven {
        name = "BlameJared (JEI)"
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    // Sinytra Forgified Fabric API for networking & payload support
    implementation libs.ffapi

    // JEI API and runtime
    compileOnly libs.jei.common.api
    compileOnly libs.jei.neoforge.api
    runtimeOnly libs.jei.neoforge
}

processResources {
    def meta = [
        version        : version,
        modId          : modId,
        modName        : modName,
        modDescription : modDescription,
        authors        : authors,
        credits        : credits,
        license        : license,
        homepage       : "https://github.com/${user}/${slug}",
        issues         : "https://github.com/${user}/${slug}/issues",
        sources        : "https://github.com/${user}/${slug}",
        mc             : minecraftVersion,
        neoForgeVersion: neoForgeVersion
    ]
    inputs.properties(meta)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(meta)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.slug}" }
    }
    manifest {
        attributes([
            "Specification-Title"     : project.modName,
            "Specification-Vendor"    : project.authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.modName,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : project.authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
